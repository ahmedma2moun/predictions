name: Android (native) — Release APK → Firebase

# Manual-only while the React Native app (android-publish.yml) is still the shipping build — both distribute
# to the same Firebase app. At cutover (plan §4 Phase 6): replace android-publish.yml with this file and
# add the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - 'native/android/**'
  #     - 'native/design-tokens/**'
  #     - 'native/VERSION'
  #     - '.github/workflows/native-android-publish.yml'

concurrency:
  group: native-android-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Gradle Build → Firebase Distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Create a release keystore and add the four ANDROID_* secrets (see docs/architecture/DEPLOYMENT_GUIDE.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: native/android
        run: ./gradlew testDebugUnitTest --no-daemon

      # versionCode was always 1 with the RN debug builds; run number + offset keeps it strictly increasing.
      - name: Build signed release APK (R8)
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionCodeOverride=$((GITHUB_RUN_NUMBER + 1000))

      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:324923947200:android:9453983ba1902076c5d525"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: native/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Build from ${{ github.sha }} — ${{ github.event.head_commit.message }}"
