name: Native — checks

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-checks.yml'
      - '.github/scripts/native-parity.py'
  workflow_dispatch:

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      tokens: ${{ steps.filter.outputs.tokens }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'native/ios/**'
              - 'native/contract/**'
              - 'native/VERSION'
            android:
              - 'native/android/**'
              - 'native/contract/**'
              - 'native/VERSION'
            tokens:
              - 'native/design-tokens/**'
              - 'native/ios/**/DesignSystem/**'
              - 'native/android/**/designsystem/**'

  native-parity:
    name: Parity guard (iOS ↔ Android)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check both platforms changed together
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/native-parity.py

  tokens-drift:
    name: Design tokens are up to date
    needs: changes
    if: needs.changes.outputs.tokens == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-generate and compare
        run: node native/design-tokens/generate.mjs --check

  android-test:
    name: Android — unit + fixture tests
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + compile
        working-directory: native/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

  ios-test:
    name: iOS — unit + fixture tests
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    # macOS minutes are the expensive ones, hence the path filter above.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('native/ios/project.yml') }}
      - name: Generate project
        run: native/ios/generate.sh
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project native/ios/FootballPredictions.xcodeproj \
            -scheme FootballPredictions \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -clonedSourcePackagesDirPath ~/spm-packages \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
