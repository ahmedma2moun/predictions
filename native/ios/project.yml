name: FootballPredictions
options:
  bundleIdPrefix: com.maamoun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# MARKETING_VERSION / DEVELOPMENT_TEAM / PROFILE_NAME come from the environment (see generate.sh and the CI workflow).
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

targets:
  FootballPredictions:
    type: application
    platform: iOS
    sources:
      - path: FootballPredictions
        excludes:
          - Resources/GoogleService-Info.plist
      - path: FootballPredictions/Resources/GoogleService-Info.plist
        buildPhase: resources
    entitlements:
      path: FootballPredictions/FootballPredictions.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: FootballPredictions/Info.plist
      properties:
        CFBundleDisplayName: Football Predictions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: SplashIcon
          UIImageRespectsSafeAreaInsets: false
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        UIBackgroundModes:
          - remote-notification
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        FirebaseAppDelegateProxyEnabled: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maamoun.footballpredictions
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
          PROVISIONING_PROFILE_SPECIFIER: ${PROFILE_NAME}

  FootballPredictionsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FootballPredictionsTests
      - path: ../contract/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: FootballPredictions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maamoun.footballpredictions.tests
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FootballPredictions.app/FootballPredictions

schemes:
  FootballPredictions:
    build:
      targets:
        FootballPredictions: all
        FootballPredictionsTests: [test]
    test:
      targets:
        - FootballPredictionsTests
    run:
      config: Debug
    archive:
      config: Release
